default:
  image: ubuntu:24.04
  interruptible: true

before_script:
  - apt-get update -qq &&
    DEBIAN_FRONTEND="noninteractive" apt-get install -y --no-install-recommends -qq
    build-essential ca-certificates clang clang-format clang-tidy cmake gcovr git
    lcov libjson-xs-perl ninja-build

stages:
  - lint
  - build
  - test
  - deploy

# Enforce .clang-format and .clang-tidy. clang-tidy needs a compile database and
# only sees the header-only templates in include/ through the unit tests, so
# configure with tests enabled and lint both src/ and tst/.
lint:
  stage: lint
  script:
    - git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run --Werror
    - cmake -S . -B build/ -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - git ls-files 'src/*.cpp' 'tst/*.cpp' | xargs -r clang-tidy --quiet --warnings-as-errors='*' -p build/

# Release smoke test under both supported compilers.
build:
  stage: build
  parallel:
    matrix:
      - CXX: [g++, clang++]
  script:
    - cmake -S . -B build/ -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=$CXX
    - cmake --build build/

# Unit tests under both supported compilers.
test:
  stage: test
  parallel:
    matrix:
      - CXX: [g++, clang++]
  script:
    - cmake -S . -B build/ -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=$CXX
    - cmake --build build/ --target test-signals
    - ./build/tst/test-signals --gtest_output="xml:report.xml"
  artifacts:
    reports:
      junit: report.xml

# Code coverage. lcov/gcovr are gcov-based, so this runs under GCC.
coverage:
  stage: test
  script:
    - cmake -S . -B build/ -G Ninja -DCODE_COVERAGE=On -DCMAKE_CXX_COMPILER=g++
    - cmake --build build/ --target check-coverage
  coverage: '/^TOTAL.*\s+(\d+\%)$/'

# Build distributable packages, only on the default branch and on tags.
package:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cmake -S . -B signals/ -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build signals/ --target package
    - cmake --build signals/ --target package_source
  artifacts:
    paths:
      - signals/signals-*-Linux.*
